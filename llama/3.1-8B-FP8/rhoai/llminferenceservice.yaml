# RHOAI 3.5 Distributed Inference with llm-d.
#
# apiVersion verified against a live CRD, 2026-10-04. The cluster serves BOTH
# v1alpha1 and v1alpha2, and the two Red Hat books document DIFFERENT versions
# rather than contradicting each other:
#   RHOAI 3.5 book  -> v1alpha1 (template nested under spec.router)
#   RHAII 3.5 book  -> v1alpha2 (template at spec.template)  <- this file
# Confirmed present in v1alpha2: spec.template, spec.model.uri (required),
# spec.replicas, spec.router. scheduler has no required children, so
# `scheduler: {}` is valid.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: llama-3-1-8b-fp8
  labels:
    app: llama-3-1-8b-fp8
spec:
  model:
    # OCI is a documented URI scheme alongside s3://, pvc:// and hf://
    uri: oci://registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct-fp8-dynamic:1.5
    name: llama-3-1-8b-fp8
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        args:
          - --model=/mnt/models
          - --served-model-name=llama-3-1-8b-fp8
          - --host=0.0.0.0
          - --port=8000
          - --max-model-len=32768
          - --gpu-memory-utilization=0.90
        resources:
          limits:
            cpu: "4"
            memory: 28Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 20Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
