apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-embedding-8b
  labels:
    app: qwen3-embedding-8b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-embedding-8b
  template:
    metadata:
      labels:
        app: qwen3-embedding-8b
    spec:
      serviceAccountName: vllm-inference
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: quay.io/danclark/qwen3-embedding-8b-offline:latest
          args:
            - /models/Qwen3-Embedding-8B
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3-embedding-8b
            - --runner
            - pooling
            - --convert
            - embed
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.90"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 36Gi
            requests:
              nvidia.com/gpu: "1"
              memory: 28Gi
              cpu: "4"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
