# Credentials Secret required by every OLSConfig stub in this directory.
#
# An in-cluster vLLM endpoint needs no authentication, but OLS requires the
# Secret anyway. Per the OLS docs: "If your Red Hat OpenShift AI endpoint does
# not require a token, you must still set the token value to any valid string
# for the request to authenticate."
#
# The key is always `apitoken`, whatever the provider calls it.
#
#   oc apply -f secret-rhoai-api-keys.yaml
#
# Or generate it imperatively instead of committing a placeholder:
#   oc create secret generic rhoai-api-keys \
#     --from-literal=apitoken=unused \
#     -n openshift-lightspeed
apiVersion: v1
kind: Secret
metadata:
  name: rhoai-api-keys
  namespace: openshift-lightspeed
type: Opaque
stringData:
  # Not a real credential. The in-cluster endpoint ignores it; OLS only
  # requires that something non-empty is present.
  apitoken: unused
