# RHOAI 3.5 Distributed Inference with llm-d.
#
# apiVersion: RHAII 3.5 and KB 7141739 both document v1alpha2; the RHOAI 3.5
# book shows v1alpha1 in some examples. Confirm against your cluster before
# applying:
#   oc get crd llminferenceservices.serving.kserve.io \
#     -o jsonpath='{.spec.versions[*].name}'
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: ministral-3-14b
  labels:
    app: ministral-3-14b
spec:
  model:
    # OCI is a documented URI scheme alongside s3://, pvc:// and hf://
    uri: oci://registry.redhat.io/rhai/modelcar-ministral-3-14b-instruct-2512:3.0
    name: ministral-3-14b
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        args:
          - --model=/mnt/models
          - --served-model-name=ministral-3-14b
          - --tokenizer-mode=mistral
          - --config-format=mistral
          - --load-format=mistral
          - --host=0.0.0.0
          - --port=8000
          - --max-model-len=32768
          - --gpu-memory-utilization=0.90
        resources:
          limits:
            cpu: "4"
            memory: 36Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 28Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
