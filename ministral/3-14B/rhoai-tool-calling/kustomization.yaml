apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../rhoai

# Adds the tool-calling flags documented for this model family in
# "Extending Red Hat AI Inference with tool calling capabilities" (RHAII 3.5).
patches:
  - target:
      group: serving.kserve.io
      kind: LLMInferenceService
      name: ministral-3-14b
    patch: |-
      - op: replace
        path: /spec/template/containers/0/args
        value:
          - --model=/mnt/models
          - --served-model-name=ministral-3-14b
          - --tokenizer-mode=mistral
          - --config-format=mistral
          - --load-format=mistral
          - --host=0.0.0.0
          - --port=8000
          - --max-model-len=32768
          - --gpu-memory-utilization=0.90
          - --enable-auto-tool-choice
          - --tool-call-parser=mistral
